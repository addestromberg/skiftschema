name: iOS checks

on:
  workflow_dispatch:
  push:
    branches: [ios]
  pull_request:
    paths:
      - 'ios/**'
      - 'data/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  build:
    name: Run Skiftschema on iPhone Simulator
    runs-on: macos-15
    timeout-minutes: 15
    env:
      APP_BUNDLE: ios/DerivedData/Build/Products/Debug-iphonesimulator/Skiftschema.app
    steps:
      - uses: actions/checkout@v6
      - name: Select an available iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          for runtime in sorted(runtimes, key=lambda value: tuple(map(int, re.findall(r"\d+", value))), reverse=True):
              for device in runtimes[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit()
          sys.exit("No available iPhone simulator")
          ')
          echo "SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
      - name: Build app for the selected iPhone
        run: |
          xcodebuild -project ios/Skiftschema.xcodeproj -scheme Skiftschema \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES build
      - name: Boot iPhone and launch Skiftschema
        timeout-minutes: 5
        run: |
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" "$APP_BUNDLE"
          xcrun simctl launch "$SIMULATOR_ID" se.skiftschema.app
          sleep 5
          xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/skiftschema-launch.png"
      - name: Upload launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: skiftschema-iphone-launch
          path: ${{ runner.temp }}/skiftschema-launch.png
          if-no-files-found: error
      - name: Run the simulator preview
        timeout-minutes: 6
        run: |
          xcodebuild -project ios/Skiftschema.xcodeproj -scheme Skiftschema \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath ios/DerivedData -resultBundlePath "$RUNNER_TEMP/SimulatorPreview.xcresult" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES test
      - name: Verify shared roster resources
        run: |
          /usr/libexec/PlistBuddy -c "Print NSCalendarsFullAccessUsageDescription" "$APP_BUNDLE/Info.plist"
          bundle="$APP_BUNDLE/data"
          for roster in data/five-????.json data/six-????.json; do
            cmp "$roster" "$bundle/${roster##*/}"
          done
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/SimulatorPreview.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/SimulatorPreview.xcresult" \
              --output-path "$RUNNER_TEMP/skiftschema-screenshots"
          fi
      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skiftschema-iphone-screenshots
          path: ${{ runner.temp }}/skiftschema-screenshots

  package:
    name: Build unsigned iPhone IPA
    if: github.ref == 'refs/heads/ios' && github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Build for physical iPhones
        run: |
          xcodebuild -project ios/Skiftschema.xcodeproj -scheme Skiftschema \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/device-build" CODE_SIGNING_ALLOWED=NO build
      - name: Package and verify IPA
        run: |
          app="$RUNNER_TEMP/device-build/Build/Products/Release-iphoneos/Skiftschema.app"
          platform=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")
          test "$platform" = iPhoneOS
          test "$(xcrun lipo -archs "$app/Skiftschema")" = arm64
          xcrun vtool -show-build "$app/Skiftschema" | grep -E 'platform +IOS$'

          staging="$RUNNER_TEMP/ipa-staging"
          mkdir -p "$staging/Payload"
          ditto "$app" "$staging/Payload/Skiftschema.app"
          ipa="$RUNNER_TEMP/Skiftschema-unsigned.ipa"
          ditto -c -k --keepParent "$staging/Payload" "$ipa"
          unzip -tq "$ipa"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Skiftschema-unsigned-IPA
          path: ${{ runner.temp }}/Skiftschema-unsigned.ipa
          if-no-files-found: error
