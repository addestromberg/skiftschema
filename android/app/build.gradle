plugins {
    id 'com.android.application'
}

android {
    namespace 'se.skiftschema.app'
    compileSdk 35

    defaultConfig {
        applicationId 'se.skiftschema.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

abstract class CollectRosters extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getRosters()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Inject
    abstract FileSystemOperations getFileSystemOperations()

    @TaskAction
    void copyRosters() {
        fileSystemOperations.sync {
            from(rosters) {
                into 'rosters'
            }
            into outputDirectory
        }
    }
}

def collectRosters = tasks.register('collectRosters', CollectRosters) {
    rosters.from(fileTree('../../data') {
        include 'five-????.json', 'six-????.json'
    })
    outputDirectory.set(layout.buildDirectory.dir('generated/rosterAssets'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(collectRosters) { task -> task.outputDirectory }
    }
}
